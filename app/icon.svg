<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Outer Bezel Ring -->
  <circle cx="16" cy="16" r="14.5" fill="#141416" stroke="#D4D7DA" stroke-width="1.5" />
  
  <!-- Concentric Calibrations -->
  <circle cx="16" cy="16" r="11" stroke="#FF4F00" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.8" />
  
  <!-- 4 Cardinal Precision Ticks -->
  <line x1="16" y1="3" x2="16" y2="6.5" stroke="#FF4F00" stroke-width="1.5" stroke-linecap="round" />
  <line x1="16" y1="25.5" x2="16" y2="29" stroke="#FF4F00" stroke-width="1.5" stroke-linecap="round" />
  <line x1="3" y1="16" x2="6.5" y2="16" stroke="#FF4F00" stroke-width="1.5" stroke-linecap="round" />
  <line x1="25.5" y1="16" x2="29" y2="16" stroke="#FF4F00" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Signal Orange Active Chrono Core -->
  <circle cx="16" cy="16" r="4.5" fill="#FF4F00" />
  <circle cx="16" cy="16" r="2" fill="#F7F7F5" />
</svg>

